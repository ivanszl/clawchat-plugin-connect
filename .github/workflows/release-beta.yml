name: Release beta

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Windows service behavior and bundled assets
        shell: pwsh
        run: |
          bun test tests/background-service.test.ts
          bun test tests/build-release.test.ts tests/release-channel.test.ts
          bun test tests/release-bundle.test.ts --test-name-pattern "native Windows packager creates the exact archive-root payload"
          bun scripts/verify-liveware-bundle.ts

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          foreach ($script in @("install.ps1", "scripts/package-windows-release.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Build and run Windows x64 smoke checks
        shell: pwsh
        run: |
          bun run build:web
          New-Item -ItemType Directory -Path build/windows-smoke -Force | Out-Null
          bun build ./src/bin.ts `
            --compile `
            --minify `
            --target=bun-windows-x64 `
            --outfile=build/windows-smoke/clawchat-connect.exe
          Copy-Item vendor/liveware/liveware-windows-amd64.exe build/windows-smoke/liveware.exe
          & ./build/windows-smoke/clawchat-connect.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/windows-smoke/liveware.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    needs: [windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify beta version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            echo "Only beta versions may be released" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic code checks
        run: bun run check:core

      - name: Build standalone binaries
        shell: bash
        run: |
          set -euo pipefail
          bun run build:web
          mkdir -p build/release build/bin
          while read -r target platform architecture; do
            if [ "${platform}" = "windows" ]; then
              output="build/bin/${platform}-${architecture}/clawchat-connect.exe"
            else
              output="build/bin/${platform}-${architecture}/clawchat-connect"
            fi
            mkdir -p "$(dirname "${output}")"
            bun build ./src/bin.ts --compile --minify --target="${target}" --outfile="${output}"
            case "${architecture}" in
              x64) liveware_architecture="amd64" ;;
              arm64) liveware_architecture="arm64" ;;
              *) echo "Unsupported Liveware architecture: ${architecture}" >&2; exit 1 ;;
            esac
            if [ "${platform}" = "windows" ]; then
              liveware_asset="liveware-windows-${liveware_architecture}.exe"
            else
              chmod 755 "${output}"
              liveware_asset="liveware-${platform}-${liveware_architecture}"
            fi
            sh scripts/verify-liveware-bundle.sh "${liveware_asset}"
            if [ "${platform}" = "windows" ]; then
              sh scripts/package-windows-release.sh \
                "${output}" \
                dist/client \
                "vendor/liveware/${liveware_asset}" \
                "build/release/clawchat-connect-${platform}-${architecture}.zip"
            else
              sh scripts/package-release-archive.sh \
                "${output}" \
                dist/client \
                "vendor/liveware/${liveware_asset}" \
                "build/release/clawchat-connect-${platform}-${architecture}.tar.gz"
            fi
          done <<'TARGETS'
          bun-darwin-arm64 darwin arm64
          bun-darwin-x64 darwin x64
          bun-linux-arm64 linux arm64
          bun-linux-x64-baseline linux x64
          bun-windows-arm64 windows arm64
          bun-windows-x64 windows x64
          TARGETS
          cp install.sh install.ps1 build/release/
          grep -F "raw.githubusercontent.com/\${repository}/release-channel/latest-beta.txt" build/release/install.sh
          grep -F 'raw.githubusercontent.com/$repository/release-channel/latest-beta.txt' build/release/install.ps1
          cp CHANGELOG.md build/release/
          cd build/release
          sha256sum clawchat-connect-*.tar.gz clawchat-connect-*.zip install.sh install.ps1 CHANGELOG.md > checksums.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${package_version}]" '
            index($0, heading) == 1 { printing = 1 }
            printing && /^## \[/ && index($0, heading) != 1 { exit }
            printing { print }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md
          bun scripts/release-beta.ts publish build/release-notes.md build/release/*

      - name: Advance beta release channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bun scripts/release-beta.ts advance-channel
