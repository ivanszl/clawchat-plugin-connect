name: Release beta

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify beta version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            echo "Only beta versions may be released" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "v${package_version}"
          fi

  release:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build qualified Darwin arm64 release
        run: bun run build:release
      - name: Publish GitHub prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${package_version}]" '
            index($0, heading) == 1 { printing = 1 }
            printing && /^## \[/ && index($0, heading) != 1 { exit }
            printing { print }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md
          bun scripts/release-beta.ts publish build/release-notes.md build/release/*

      - name: Advance beta release channel
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bun scripts/release-beta.ts advance-channel
